name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: eng
          POSTGRES_PASSWORD: eng
          POSTGRES_DB: eng_remember
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eng -d eng_remember"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+asyncpg://eng:eng@localhost:5432/eng_remember
      TEST_DATABASE_URL: postgresql+asyncpg://eng:eng@localhost:5432/eng_remember

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Audit dependencies
        run: make audit

      - name: Lint
        run: make lint

      - name: Type check
        run: make typecheck

      - name: Apply migrations
        run: make migrate

      - name: Check models and migrations agree
        run: make migrate-check

      - name: Unit tests
        run: make test

      - name: Integration tests
        run: make test-integration
