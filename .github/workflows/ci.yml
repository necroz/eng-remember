name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The image is what actually ships: a Dockerfile that no longer builds is
      # invisible to every other job here, because they run on the host.
      - name: Build the image
        run: docker build --tag eng-remember:ci .

  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: eng
          POSTGRES_PASSWORD: eng
          POSTGRES_DB: eng_remember
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eng -d eng_remember"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+asyncpg://eng:eng@localhost:5432/eng_remember
      TEST_DATABASE_URL: postgresql+asyncpg://eng:eng@localhost:5432/eng_remember

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Audit dependencies
        run: make audit

      # Only the hooks that catch something the other jobs do not: a token
      # pasted into a fixture, an unparsable workflow. The full set would rerun
      # ruff and mypy here, and its fixer hooks would modify files instead of
      # reporting them.
      - name: Secret and config hooks
        run: |
          uv run pre-commit run detect-private-key --all-files
          uv run pre-commit run no-secrets --all-files
          uv run pre-commit run check-yaml --all-files
          uv run pre-commit run check-toml --all-files

      - name: Lint
        run: make lint

      - name: Type check
        run: make typecheck

      - name: Apply migrations
        run: make migrate

      - name: Check models and migrations agree
        run: make migrate-check

      # A revision that cannot be rolled back is discovered at the worst
      # possible moment otherwise. The database here is the throwaway service
      # one, so the destructive downgrades cost nothing.
      - name: Migration roundtrip
        run: |
          make downgrade
          make migrate
          # Second run on an up-to-date database must be a no-op.
          make migrate

      - name: Unit tests
        run: >
          uv run pytest -m "not integration"
          --cov=eng_remember --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

      - name: Integration tests
        run: make test-integration