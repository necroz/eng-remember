version: 2

updates:
  # Python dependencies, pinned by uv.lock.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # The actions used by the workflow itself.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # The python base image in the Dockerfile. The uv builder image lives on
  # ghcr.io, which this ecosystem does not read; it is bumped by hand.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Python 3.15 is not usable yet: pydantic-core has no cp315 wheels, and
      # the uv 3.15 builder image only exists for trixie. Revisit separately.
      - dependency-name: "python"
        versions: ["~> 3.15.0"]
