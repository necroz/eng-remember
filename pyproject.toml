[project]
name = "eng-remember"
version = "0.1.0"
description = "Telegram bot for memorising English words with spaced repetition"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "fsrs>=5.0",
    "openai>=1.59",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4",
]

[project.scripts]
eng-remember = "eng_remember.__main__:run"
eng-remember-remind = "eng_remember.remind:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eng_remember"]

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
    "mypy>=1.14",
    "pip-audit>=2.10",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF",
]
ignore = [
    "E501",
    # The UI is Russian: Cyrillic letters next to Latin ones are the normal
    # case here, not a homoglyph mistake.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["alembic.*", "fsrs.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that need a real PostgreSQL instance (docker compose up -d db)",
]
addopts = "-q"
