# Install once with `uv run pre-commit install`.
# `--all-files` mode is used in CI via `make check`, so these hooks are only a
# local convenience and stay fast.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # Run through the project environment so the version matches pyproject.
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false

      # `.env` is gitignored, which covers the file itself but not a token
      # pasted into a test fixture or a doc example. Telegram bot tokens and
      # OpenAI-style keys have unmistakable shapes, so they are cheap to catch.
      - id: no-secrets
        name: no secrets
        entry: >
          bash -c 'if grep -nHE "[0-9]{8,12}:[A-Za-z0-9_-]{35}|sk-[A-Za-z0-9._-]{32,}" "$@";
          then echo "Похоже на токен или ключ. Уберите его из индекса и перевыпустите." >&2; exit 1; fi' --
        language: system
        types: [text]
