name: eng-remember

# Inside the network the database is reachable by service name, unlike the
# localhost URL in .env, which is for processes running on the host.
x-database-url: &database-url postgresql+asyncpg://${POSTGRES_USER:-eng}:${POSTGRES_PASSWORD:-eng}@db:5432/${POSTGRES_DB:-eng_remember}

# The bot image, built once and shared by the two services that run it.
x-bot-image: &bot-image
  image: eng-remember:local
  build: .

# Container logs are the only place the bot's JSON output goes, and on a server
# that runs for months they grow until the disk fills. Three files of 10m cap
# each service, which is days of normal operation.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    logging: *logging
    # Without a policy of its own the database is the one service a reboot does
    # not bring back: Docker restarts the bot, which then crash-loops against a
    # missing db. Compose dependencies do not apply here — the daemon has no
    # idea what depends on what.
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eng}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eng}
      POSTGRES_DB: ${POSTGRES_DB:-eng_remember}
    # 55432 on the host: a Postgres on the default port is common enough that
    # colliding with it would be the first thing a new checkout hits.
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the extra database the integration tests use.
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eng} -d ${POSTGRES_DB:-eng_remember}"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    <<: *bot-image
    logging: *logging
    # A missing .env is not a compose error: the bot then fails with its own
    # message explaining what to put there.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
    # One-shot: compose runs this before the bot and waits for it to succeed, so
    # a first deploy on an empty volume creates the schema. The container image
    # itself never migrates (see the Dockerfile) — starting a bot must not
    # silently change the schema.
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    profiles: ["full"]

  bot:
    <<: *bot-image
    logging: *logging
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    profiles: ["full"]

volumes:
  pgdata:
